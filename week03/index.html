<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Dark Futuristic Week 03 semantic structural frame."
  >

  <title>Dark Futuristic | Week 03</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <a class="skip-link" href="#catalog">
    Skip to main content
  </a>

  <header class="site-header">
    <a class="brand" href="../index.html">
      Dark Futuristic
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="#catalog">Catalog</a>
      <a href="#filters">Filters</a>
      <a href="../week02/index.html">Week 02</a>
    </nav>

    <button
      class="theme-toggle"
      type="button"
      aria-pressed="true"
      aria-label="Switch to light mode"
    >
      <span class="theme-toggle__label">Dark mode</span>
    </button>
  </header>

  <section class="layout-frame">
    <aside
      id="filters"
      class="filter-rail"
      aria-labelledby="filters-heading"
    >
      <header class="rail-header">
        <h2 id="filters-heading">Filters</h2>
      </header>

      <nav class="filter-nav" aria-label="Catalog filter navigation">
        <a href="#filter-zone-1">Genre</a>
        <a href="#filter-zone-2">Platform</a>
        <a href="#filter-zone-3">Rating</a>
        <a href="#filter-zone-4">Release</a>
      </nav>
    </aside>

    <main
      id="catalog"
      class="catalog"
      aria-labelledby="catalog-heading"
    >
      <header class="catalog-header">
        <h1 id="catalog-heading">Game Catalog</h1>
      </header>

      <section
        class="catalog-grid"
        aria-label="Catalog structural zones"
      >
        <section
          id="filter-zone-1"
          class="catalog-frame"
          aria-label="Featured catalog zone"
        ></section>

        <section
          id="filter-zone-2"
          class="catalog-frame"
          aria-label="Main catalog zone"
        ></section>

        <section
          id="filter-zone-3"
          class="catalog-frame"
          aria-label="Comparison zone"
        ></section>

        <section
          id="filter-zone-4"
          class="catalog-frame"
          aria-label="Discovery zone"
        ></section>
      </section>
    </main>
  </section>

  <footer class="site-footer">
    <p>Dark Futuristic · Week 03</p>

    <nav aria-label="Secondary navigation">
      <a href="../index.html">Milestone Directory</a>
      <a href="../week02/index.html">Week 02</a>
    </nav>
  </footer>

  <script>
    const root = document.documentElement;
    const toggle = document.querySelector(".theme-toggle");
    const label = document.querySelector(".theme-toggle__label");

    toggle.addEventListener("click", () => {
      const nextTheme =
        root.dataset.theme === "dark" ? "light" : "dark";

      root.dataset.theme = nextTheme;

      const darkModeActive = nextTheme === "dark";

      toggle.setAttribute(
        "aria-pressed",
        String(darkModeActive)
      );

      toggle.setAttribute(
        "aria-label",
        darkModeActive
          ? "Switch to light mode"
          : "Switch to dark mode"
      );

      label.textContent =
        darkModeActive ? "Dark mode" : "Light mode";
    });
  </script>
</body>
</html>
