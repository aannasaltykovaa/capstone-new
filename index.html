<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Dark Futuristic capstone project milestone directory."
  >

  <title>Dark Futuristic | Capstone Milestones</title>

  <style>
    :root {
      color-scheme: dark;

      --background: oklch(14% 0.02 260);
      --surface: oklch(20% 0.03 260);
      --text: oklch(94% 0.01 100);
      --muted: oklch(74% 0.03 240);
      --primary: oklch(90% 0.20 102);
      --secondary: oklch(78% 0.16 208);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      place-items: center;
      color: var(--text);
      background: var(--background);
    }

    main {
      width: min(100%, 46rem);
      padding: clamp(1.5rem, 4vw, 3rem);
      background: var(--surface);
      border: 1px solid var(--secondary);
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .eyebrow {
      color: var(--primary);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin-block: 0.5rem;
      font-size: clamp(2rem, 1.4rem + 2.5vw, 3.5rem);
      line-height: 1;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1rem;
      color: var(--background);
      background: var(--primary);
      border: 1px solid var(--primary);
      font-weight: 800;
      text-decoration: none;
    }

    a.secondary {
      color: var(--text);
      background: transparent;
      border-color: var(--secondary);
    }

    a:focus-visible {
      outline: 0.2rem solid var(--secondary);
      outline-offset: 0.2rem;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">Capstone Project Directory</p>

    <h1>Dark Futuristic</h1>

    <p>Video game curation and discovery portal.</p>

    <nav aria-label="Capstone milestones">
      <a href="week06/index.html">
        Open Week 06
      </a>
      
       <a href="week05/index.html">
        Open Week 05
      </a>
      
      <a href="week04/index.html">
        Open Week 04
      </a>
      
      <a href="week03/index.html">
        Open Week 03
      </a>

      <a class="secondary" href="week02/index.html">
        Open Week 02
      </a>
    </nav>
  </main>
</body>
</html>
